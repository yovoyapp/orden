<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orden">
<title>Orden · Mente, Cuerpo, Espíritu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1222; --bg2:#171b31; --card:#1c2140; --line:#2a3058;
    --text:#eef0fb; --muted:#9aa1c7;
    --mente:#a78bfa; --cuerpo:#34d399; --espiritu:#fbbf24; --accent:#7dd3fc;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:var(--text)}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;height:44px}
  .top .date{font-size:.95rem;color:var(--muted);flex:1;text-align:center}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;color:var(--muted)}
  .icon-btn:active{background:var(--card)}
  .icon-btn.hidden{visibility:hidden}

  /* Tabs */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border:1px solid var(--line);
    border-radius:999px;padding:4px;margin:6px 0 6px}
  .tabs button{padding:10px 4px;border-radius:999px;font-weight:600;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
  .tabs button small{font-weight:500;font-size:.7rem;color:var(--muted)}
  .tabs button[data-cat=mente].active{background:color-mix(in srgb,var(--mente) 22%,transparent);color:var(--mente)}
  .tabs button[data-cat=cuerpo].active{background:color-mix(in srgb,var(--cuerpo) 22%,transparent);color:var(--cuerpo)}
  .tabs button[data-cat=espiritu].active{background:color-mix(in srgb,var(--espiritu) 22%,transparent);color:var(--espiritu)}
  .tabs button.done small{color:var(--cuerpo)}

  /* Clock */
  .clock-wrap{display:grid;place-items:center;margin:4px 0 18px}
  .clock{position:relative;width:min(72vw,260px);aspect-ratio:1}
  .clock svg{width:100%;height:100%}
  .clock .track{fill:none;stroke:var(--card);stroke-width:12}
  .clock .prog{fill:none;stroke:#34d399;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s ease,stroke 1s ease}
  .clock-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .time{font-size:clamp(3rem,15vw,4.2rem);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sec{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;margin-top:-4px}
  .score{margin-top:8px;font-size:.8rem;color:var(--muted);background:var(--bg2);padding:4px 10px;border-radius:999px}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .big{font-size:1.45rem;font-weight:700}
  .muted{color:var(--muted);font-size:.92rem;margin-top:4px}
  .now .big{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{padding:8px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.88rem}
  .bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:99px}
  .week-row{display:flex;justify-content:space-between;font-size:.95rem;margin-top:10px}

  /* Category */
  .cat-title{font-size:1.6rem;font-weight:800;margin:0 0 4px}
  .datenav{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
  .datenav span{font-weight:600}
  .datenav button{width:40px;height:36px;border-radius:10px;font-size:1.2rem}
  .datenav button:disabled{opacity:.25}

  .task{display:flex;align-items:center;gap:14px}
  .check{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem;transition:.15s}
  .check.on{border-color:transparent;color:#0f1222;font-weight:900}
  [data-c=mente] .check.on{background:var(--mente)}
  [data-c=cuerpo] .check.on{background:var(--cuerpo)}
  [data-c=espiritu] .check.on{background:var(--espiritu)}
  .task .info{flex:1;min-width:0}
  .task .t{font-weight:650;font-size:1.05rem}
  .task .s{color:var(--muted);font-size:.85rem;margin-top:2px}
  .pill-btn{padding:8px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill-btn.running{border-color:var(--mente);color:var(--mente)}

  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:40px;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:1.3rem}
  .stepper b{min-width:64px;text-align:center;font-size:1.3rem;font-variant-numeric:tabular-nums}
  .goal-ok{color:var(--cuerpo)}
  .head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .head-row h3{margin:0;font-size:1.1rem}

  .meal{display:grid;grid-template-columns:84px 1fr 42px;align-items:center;gap:8px;margin-top:8px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .quick[hidden]{display:none}
  .qchip{padding:7px 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem}
  .qchip:active{background:color-mix(in srgb,var(--cuerpo) 25%,transparent);border-color:var(--cuerpo)}
  .qchip.undo{color:var(--muted)}
  .idea-btn{width:42px;height:42px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:1.1rem}
  .idea-btn.on{border-color:var(--cuerpo);background:color-mix(in srgb,var(--cuerpo) 18%,transparent)}
  .ideas{margin:8px 0 4px;padding:10px;border-radius:14px;background:var(--bg2);border:1px dashed var(--line)}
  .idea{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
  .idea:active{border-color:var(--cuerpo)}
  .idea .it{font-weight:600;font-size:.95rem}
  .idea .iw{color:var(--muted);font-size:.82rem;margin-top:3px;line-height:1.3}
  .tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--cuerpo);color:#0f1222;vertical-align:1px}
  .tag.gusto{background:var(--espiritu)}
  .menu-day{padding:10px 12px;border-radius:12px;background:var(--bg2);margin-top:8px;font-size:.9rem;line-height:1.45}
  .menu-day.sel{outline:1px solid var(--cuerpo)}
  .menu-day b{display:block;margin-bottom:2px}
  .meal label{color:var(--muted);font-size:.9rem}
  .meal input,.field input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
  .meal input:focus,.field input:focus{border-color:var(--accent)}
  .note{background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--muted);margin-top:10px}

  .weekdots{display:flex;gap:6px;margin-top:12px}
  .weekdots span{flex:1;text-align:center;padding:6px 0;border-radius:8px;background:var(--bg2);font-size:.75rem;color:var(--muted)}
  .weekdots span.on{color:#0f1222;font-weight:700}
  [data-c=cuerpo] .weekdots span.on{background:var(--cuerpo)}
  [data-c=espiritu] .weekdots span.on{background:var(--espiritu)}
  .weekdots span.today{outline:1px solid var(--muted)}

  .reco h3{margin:0 0 8px;font-size:1rem}
  .reco ul{margin:0;padding-left:18px}
  .reco li{margin:6px 0;color:var(--muted);font-size:.92rem;line-height:1.35}

  .subbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  .hist-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--muted);font-size:.85rem;border:1px solid transparent}
  .hist-btn.active,.hist-btn:active{color:var(--accent);border-color:var(--line);background:var(--bg2)}
  .hist{padding:0;overflow:hidden}
  .hist-head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;font-weight:650;text-align:left}
  .score-pill{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--bg2);color:var(--muted);font-weight:600}
  .score-pill.full{background:color-mix(in srgb,var(--cuerpo) 22%,transparent);color:var(--cuerpo)}
  .hist-body{padding:0 16px 16px}
  .hline{display:flex;gap:10px;margin:6px 0}
  .hline p{margin:0;font-size:.93rem;line-height:1.4}
  .nut{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .nut-head{display:flex;justify-content:space-between;font-size:.95rem}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
  .vchip{font-size:.78rem;padding:5px 9px;border-radius:99px;background:var(--bg2);color:var(--muted)}
  .vchip.ok{background:color-mix(in srgb,var(--cuerpo) 22%,transparent);color:var(--cuerpo)}
  .vchip.mid{background:color-mix(in srgb,var(--espiritu) 18%,transparent);color:var(--espiritu)}
  .tiny{font-size:.72rem;color:var(--muted);margin-top:10px;opacity:.8}
  .tag.falta{background:#f472b6}
  .tomorrow{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,var(--bg2));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .tomorrow ul{margin:4px 0 0;padding:0;list-style:none}
  .tomorrow li{margin:7px 0;font-size:.9rem;line-height:1.4}
  /* Settings */
  .field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);flex:1}
  .row{display:flex;gap:10px;margin-top:8px}
  .btn{display:block;width:100%;text-align:center;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-weight:600;margin-top:10px}
  .btn.danger{color:#f87171}
  .btn.small{display:inline-block;width:auto;padding:6px 12px;font-size:.85rem;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="homeBtn" class="icon-btn hidden" data-act="go" data-v="home" aria-label="Inicio">‹</button>
    <div class="date" id="todayLabel"></div>
    <button class="icon-btn" data-act="go" data-v="ajustes" aria-label="Ajustes">⚙︎</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-act="go" data-v="mente" data-cat="mente">Mente<small></small></button>
    <button data-act="go" data-v="cuerpo" data-cat="cuerpo">Cuerpo<small></small></button>
    <button data-act="go" data-v="espiritu" data-cat="espiritu">Espíritu<small></small></button>
  </nav>
  <div class="subbar"><button class="hist-btn" id="histBtn" data-act="go" data-v="historial" aria-label="Historial">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    <span>Historial</span></button></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ Datos ============ */
const STORE_KEY = 'ordenVida.v1';
const DEFAULT_SCHEDULE = [
  {id:'s1', emoji:'😴', estar:'durmiendo', para:'dormir', start:'01:30', end:'08:30'},
  {id:'s2', emoji:'🎥', estar:'haciendo el directo', para:'el directo', start:'10:30', end:'11:30'},
  {id:'s3', emoji:'🎥', estar:'haciendo el directo', para:'el directo', start:'22:00', end:'23:00'},
];
const GOALS = { minutosMente:10, sueno:7, biblia:2, ejercicioSemana:3, iglesiaSemana:1 };
const MEALS = [['desayuno','Desayuno'],['almuerzo','Almuerzo'],['merienda','Merienda'],['cena','Cena']];
const MENTE = [
  {id:'meditar', emoji:'🧘', title:'Meditar', tip:'Sentate cómodo, cerrá los ojos y seguí tu respiración durante 10 minutos.'},
  {id:'aire', emoji:'🌿', title:'Tomar aire fresco', tip:'Salí a caminar a la vuelta de la manzana o al balcón, sin el celular.'},
  {id:'entretenimiento', emoji:'🎨', title:'Entretenimiento sano', tip:'Leer, dibujar, tocar música o un juego de mesa: algo que te recargue.'},
];

function blankDay(){
  return {meditar:false, aire:false, entretenimiento:false, sueno:null, ejercicio:false,
          biblia:0, agradecer:false, iglesia:false,
          comidas:{desayuno:'',almuerzo:'',merienda:'',cena:''}};
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && typeof s === 'object' && s.days){
      if(!Array.isArray(s.schedule)) s.schedule = structuredClone(DEFAULT_SCHEDULE);
      s.timers = s.timers || {};
      return s;
    }
  }catch(e){}
  return {days:{}, schedule:structuredClone(DEFAULT_SCHEDULE), timers:{}};
}
let state = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ============ Fechas ============ */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const todayKey = () => keyOf(new Date());
const fmtLong = new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort = new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'short'});

function getDay(k){
  const d = Object.assign(blankDay(), state.days[k] || {});
  d.comidas = Object.assign(blankDay().comidas, (state.days[k]||{}).comidas || {});
  return d;
}
function updateDay(k, patch){ state.days[k] = Object.assign(getDay(k), patch); save(); }

function weekKeys(k){
  const d = fromKey(k); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd);
  return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return keyOf(x); });
}
const weekCount = (k, field) => weekKeys(k).filter(x => state.days[x]?.[field]).length;

/* ============ Comidas (según tus gustos) ============ */
const FOOD = {
  platos: [
    {t:'Fideos con carne picada y salsa de tomate con zanahoria rallada', why:'La carne aporta hierro y B12 (energía). La zanahoria se disimula en la salsa y suma vitamina A.'},
    {t:'Fideos a la bolognesa con lentejas (mitad carne, mitad lentejas)', why:'Casi no se nota y duplica el hierro, además de sumar fibra.'},
    {t:'Ravioles con bolognesa y espinaca', why:'Espinaca: ácido fólico y hierro. El tomate de la salsa ayuda a absorberlo.'},
    {t:'Espaguetis con atún, tomates cherry cocidos y espinaca', why:'Atún: proteína y omega-3. El tomate cocido libera más licopeno (antioxidante).'},
    {t:'Arroz con carne, morrón rojo y cebolla salteados', why:'El morrón rojo es de los vegetales con más vitamina C: defensas para no enfermarte.'},
    {t:'Arroz con pollo y arvejas', why:'Pollo: proteína magra. Las arvejas suman fibra y más proteína.'},
    {t:'Fideos con pollo y brócoli salteados', why:'El brócoli es de las verduras que más aportan: vitamina C, K y fibra.'},
    {t:'Guiso de arroz con carne y calabaza', why:'La calabaza da betacaroteno (vitamina A), clave para las defensas.'},
    {t:'Pastel de papa con carne (con zapallo en el puré)', why:'Carne: hierro y zinc (defensas). Papa y zapallo: potasio y vitamina A.'},
    {t:'Merluza al horno con arroz y tomates cherry asados', why:'Pescado: proteína liviana, fácil de digerir, con yodo.'},
    {t:'Fideos con salmón o atún y salsa de tomate', why:'Omega-3: bueno para el cerebro, el corazón y la energía mental.'},
    {t:'Lasaña de carne y espinaca', why:'Carne + espinaca + tomate: hierro y vitaminas en un plato que te gusta.'},
    {t:'Canelones de carne y espinaca con salsa de tomate', why:'Hierro y ácido fólico, con la verdura escondida en el relleno.'},
    {t:'Ñoquis con salsa de carne', why:'Papa + carne: energía y proteína. ¡Ideal para el 29!'},
    {t:'Fideos con pollo y champiñones salteados', why:'Los champiñones tienen vitaminas B, que ayudan a convertir la comida en energía.'},
    {t:'Arroz salteado con huevo, pollo y zanahoria', why:'El huevo es proteína completa y B12; la zanahoria, vitamina A.'},
    {t:'Pollo al horno con papas y calabaza al horno', why:'Plato completo: proteína, energía y vitamina A, sin fritura.'},
    {t:'Bife con arroz y huevo', why:'Hierro y B12 al máximo: de lo mejor contra el cansancio.'},
  ],
  gustos: [
    {t:'Milanesa napolitana al horno con papas al horno', why:'Tu gusto de la semana: al horno lleva mucho menos aceite que frita, con el mismo sabor.', treat:true},
    {t:'Hamburguesa casera con queso y papas al horno', why:'Tu gusto de la semana: casera es carne de verdad (proteína y hierro), sin ultraprocesados.', treat:true},
  ],
  desayuno: [
    {t:'Sándwich de jamón y queso en pan integral + jugo de naranja exprimido', why:'Proteína para arrancar y vitamina C del jugo natural.'},
    {t:'Tostado de jamón, queso y huevo', why:'El huevo suma proteína y B12: energía que dura toda la mañana.'},
    {t:'Banana con un puñado de maní o nueces', why:'Potasio + grasas buenas: energía rápida y que dura.'},
    {t:'Licuado de banana con leche y avena', why:'Rápido y completo: calcio, fibra y energía sostenida.'},
    {t:'Huevos revueltos con tostadas + jugo de naranja', why:'Proteína completa y vitamina C para las defensas.'},
    {t:'Yogur con granola y banana', why:'Calcio, fibra y energía para la mañana.'},
    {t:'Avena con leche, banana y canela', why:'La avena libera energía de a poco: no te da hambre enseguida.'},
  ],
  merienda: [
    {t:'Leche con vainillas + una mandarina', why:'Tu merienda de siempre con vitamina C extra.'},
    {t:'Leche con Oreos + una fruta', why:'No hace falta dejarlas: sumale una fruta y ya mejora mucho.'},
    {t:'Licuado de banana y frutillas con leche', why:'Calcio, potasio y vitamina C en un vaso.'},
    {t:'Yogur con granola y frutillas', why:'Calcio y fibra, más los antioxidantes de la frutilla.'},
    {t:'Leche con tostadas con queso y mermelada', why:'Calcio y proteína del queso: llena más que las galletitas.'},
    {t:'Leche con avena, banana y miel', why:'Energía que dura hasta la cena.'},
    {t:'Tostado de jamón y queso + leche', why:'Merienda con proteína para cuando tenés más hambre.'},
  ],
  frutas: [
    {t:'Kiwi', why:'Tiene más vitamina C que la naranja y ayuda a la digestión.'},
    {t:'Banana', why:'Potasio y energía rápida, ideal antes de hacer ejercicio.'},
    {t:'Naranja', why:'Vitamina C para las defensas. Mejor entera que en jugo (tiene más fibra).'},
    {t:'Frutillas', why:'Vitamina C y antioxidantes.'},
    {t:'Mandarina', why:'Vitamina C y fácil de llevar a cualquier lado.'},
    {t:'Manzana', why:'Fibra que te deja satisfecho y cuida la digestión.'},
    {t:'Arándanos', why:'De las frutas con más antioxidantes.'},
  ],
};
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr, seed){ const a=arr.slice(), r=rng(seed); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function weekMenu(k){
  const wk = weekKeys(k)[0], n = (state.menuSeed||{})[wk] || 0;
  const normal = shuffled(FOOD.platos, hash(wk+'#'+n));

}

    list = [{...plan, menu:true}, ...shuffled(FOOD.platos.filter(p=>p.t!==plan.t), hash(k+meal))];
  }

  const pool = meal==='desayuno'||meal==='merienda' ? FOOD[meal] : FOOD.platos;
  const tgt = targetedIdea(meal, k, pool);
  if(tgt) list = [tgt, ...list.filter(x=>x.t!==tgt.t)];

/* ============ Horarios fijos ============ */
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
function scheduleStatus(now){
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  let current=null, endsIn=null;
  for(const b of state.schedule){
    if(!b.start || !b.end) continue;
    const s=toMin(b.start), e=toMin(b.end);
    const inside = s<=e ? (nowMin>=s && nowMin<e) : (nowMin>=s || nowMin<e);
    if(inside){ current=b; endsIn=((e-nowMin)+1440)%1440; break; }
  }
  let next=null, nextIn=Infinity;
  for(const b of state.schedule){
    if(b===current || !b.start) continue;
    let d = (toMin(b.start)-nowMin+1440)%1440; if(d===0) d=1440;
    if(d<nextIn){ nextIn=d; next=b; }
  }
  return {current, endsIn, next, nextIn};
}
function fmtDur(min){
  if(min < 1) return `${Math.max(1,Math.ceil(min*60))} seg`;
  const t = Math.ceil(min), h = Math.floor(t/60), m = t%60;
  if(!h) return `${m} min`;
  return m ? `${h} h ${m} min` : `${h} h`;
}
const hhmm = t => { const [h,m]=t.split(':'); return `${Number(h)}:${m}`; };

const ALIASES = Object.values(NUT).flatMap(f=>f.aliases.map(a=>({a, id:f.id}))).sort((x,y)=>y.a.length-x.a.length);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
ALIASES.forEach(x=> x.re = new RegExp(`(^|[^a-z])(?:(\\d+)\\s*(?:x\\s*)?)?${escRe(x.a)}`, 'g'));

function matchFoods(text){
  const found = [], unknown = [];
  for(const seg of text.split(/[+,\n]/)){
    let s = ' '+norm(seg)+' ', hits = [];
    for(const x of ALIASES){
      s = s.replace(x.re, (all, pre, n) => { const per = NUT[x.id].per||1; hits.push({id:x.id, qty: n ? Math.min(10, Number(n)/per) : 1}); return pre + ' '.repeat(all.length-pre.length); });
    }
    const ids = new Set(hits.map(h=>h.id));
    for(const h of hits.slice()){
      const c = NUT[h.id].combo;
      if(c) c.forEach(cid => { if(!ids.has(cid)){ ids.add(cid); hits.push({id:cid, qty:h.qty}); } });
    }
    hits = hits.filter(h=>!NUT[h.id].combo);
    if(hits.length) found.push(...hits); else if(seg.trim()) unknown.push(seg.trim());
  }
  return {found, unknown};
}
function analyzeDay(d){
  const t = {kcal:0,p:0,c:0,g:0,f:0}, micro = Object.fromEntries(MICROS.map(([k])=>[k,0]));
  const foods = [], unknown = [], perMeal = {};
  for(const [m] of MEALS){
    const r = matchFoods(d.comidas[m]||'');
    perMeal[m] = r.found; unknown.push(...r.unknown);
    for(const h of r.found){
      const n = NUT[h.id]; foods.push(n);
      for(const k in t) t[k] += n[k]*h.qty;
      for(const k in n.micro) micro[k] += n.micro[k]*h.qty;
    }
  }
  return {t, micro, foods, unknown, perMeal};
}

function weekBar(label, n, goal, color){
  const pct = Math.min(100, n/goal*100);
  return `<div class="week-row"><span>${label}</span><span>${n}/${goal}${n>=goal?' ✓':''}</span></div>
          <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>`;

/* El anillo se llena desde que te levantás hasta la hora de dormir.
   Verde hasta las 18:30 → se oscurece de a poco hasta violeta (23:00) → violeta hasta dormir → negro mientras dormís. */
const RING = { verdeHasta: 18*60+30, violetaDesde: 23*60, verde:[52,211,153], violeta:[167,139,250], noche:'#000000' };
function dayRing(now){
  const sleep = state.schedule.find(b=>/dorm/i.test((b.para||'')+' '+(b.estar||'')));
  const s = sleep ? toMin(sleep.start) : 90, e = sleep ? toMin(sleep.end) : 510;
  const m = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const awake = ((s-e)+1440)%1440 || 1440;
  const sinceWake = ((m-e)+1440)%1440;
  if(sinceWake >= awake) return {p:1, color:RING.noche};
  const rel = x => ((x-e)+1440)%1440;              // minutos desde que te levantaste
  const g = rel(RING.verdeHasta), v = rel(RING.violetaDesde);
  const t = sinceWake<=g ? 0 : sinceWake>=v ? 1 : (sinceWake-g)/(v-g);
  const dark = 1 - 0.45*Math.sin(Math.PI*t);       // se oscurece en el medio de la transición
  const c = RING.verde.map((x,i)=>Math.round((x+(RING.violeta[i]-x)*t)*dark));
  return {p: sinceWake/awake, color:`rgb(${c.join(',')})`};
}

const GAP_LABEL = {p:'proteína', f:'fibra', vA:'vitamina A', vC:'vitamina C', vD:'vitamina D', b12:'vitamina B12', fol:'folato', vK:'vitamina K', fe:'hierro', ca:'calcio', pot:'potasio'};
// Qué porcentaje del objetivo se alcanzó (0..1+) para cada nutriente
function nutrientLevels(a){
  const lv = {p: a.t.p/REF.p, f: a.t.f/REF.f};
  MICROS.forEach(([k])=> lv[k] = a.micro[k]/100);
  return lv;
}
// Faltantes ordenados del más grave al menos grave (solo si anotaste comidas)
function dayGaps(k){
  const d = state.days[k]; if(!d || !d.comidas) return [];
  const a = analyzeDay(getDay(k)); if(!a.foods.length) return [];
  const lv = nutrientLevels(a), limit = {p:0.8, f:0.6};
  return Object.keys(lv).filter(x => lv[x] < (limit[x] ?? 0.5)).sort((x,y)=>lv[x]-lv[y])
    .map(x => ({key:x, label:GAP_LABEL[x], pct:Math.round(lv[x]*100)}));
}
// Los alimentos (que te gustan) que más aportan de cada nutriente
function bestFoods(key, n=3){
  const val = f => key==='p' ? f.p : key==='f' ? f.f : (f.micro[key]||0);
  return Object.values(NUT).filter(f=>!f.combo && ['carb','prot','dairy','veg','fruit'].includes(f.group) && f.id!=='fruta')
    .sort((a,b)=>val(b)-val(a)).slice(0,n).map(f=>f.name.toLowerCase());
}
const dishCache = {};
function dishValue(t, key){
  if(!dishCache[t]){ const r = matchFoods(t); const tot={p:0,f:0}, mic={};
    r.found.forEach(h=>{ const n=NUT[h.id]; tot.p+=n.p*h.qty; tot.f+=n.f*h.qty; for(const m in n.micro) mic[m]=(mic[m]||0)+n.micro[m]*h.qty; });
    dishCache[t] = {...tot, ...mic}; }
  return dishCache[t][key] || 0;
}
const ENOUGH = {p:15, f:4};
// Elige el plato que mejor cubre algo que te faltó ayer (cada comida apunta a un faltante distinto)
function targetedIdea(meal, k, pool){
  const prev = fromKey(k); prev.setDate(prev.getDate()-1);
  const gaps = dayGaps(keyOf(prev)); if(!gaps.length) return null;
  const off = MEALS.findIndex(([m])=>m===meal);
  for(let i=0;i<gaps.length;i++){
    const g = gaps[(off+i)%gaps.length];
    const best = pool.slice().sort((a,b)=>dishValue(b.t,g.key)-dishValue(a.t,g.key))[0];
    if(best && dishValue(best.t,g.key) >= (ENOUGH[g.key] ?? 25)) return {...best, target:g.label};
  }
  return null;
}
function nextDayRecs(k){
  const d = getDay(k), recs = [], a = analyzeDay(d);

  if(nMeals && !a.foods.some(f=>f.group==='veg')) recs.push('🥦 No comiste verduras: probá espinaca o morrón en la salsa de la pasta.');

  // Ejercicio
  const wEj = weekCount(k,'ejercicio'), faltan = GOALS.ejercicioSemana - wEj;
  if(di===6){ if(faltan>0) recs.push('🏃 Esta semana no llegaste a 3 sesiones: arrancá la próxima con ejercicio el lunes.'); }
  else if(faltan>0 && !d.ejercicio) recs.push(faltan>=daysLeft ? `🏃 Mañana sí o sí ejercicio: te faltan ${faltan} sesiones y quedan ${daysLeft} días.` : `🏃 Hacé ejercicio mañana: te ${faltan===1?'falta 1 sesión':`faltan ${faltan} sesiones`} esta semana.`);
  // Mente

  if(!recs.length) recs.push('🙌 ¡Día completo! Mañana repetí lo mismo.');

}

  if(t.p<REF.p) return 'Te faltó proteína: agregá huevo, pollo, atún o carne en alguna comida.';
  if(t.f<REF.f*0.5) return 'Poca fibra: una fruta, avena o arvejas ayudan mucho.';
  if(m.vA<50) return 'Para vitamina A: zanahoria rallada en la salsa o calabaza al horno.';
  if(m.vD<50) return 'La vitamina D sale sobre todo del sol: tu rato de aire fresco al sol ayuda, igual que el pescado y el huevo.';
  return '¡Muy buen día de nutrientes! Seguí así.';
}
function historyHTML(){
  const tk = todayKey();
  const keys = [...new Set([tk, ...Object.keys(state.days)])].filter(k=>k<=tk).sort().reverse().slice(0,90);
  if(histOpen===null) histOpen = keys[0];
  return `<h1 class="cat-title">🕘 Historial</h1>
    <div class="muted" style="margin:-2px 0 14px">Un resumen de cada día. Tocá un día para ver el detalle.</div>
    ${keys.map(k=>{
      const items = dailyItems(k), done = items.filter(i=>i.done).length, open = histOpen===k;
      const label = k===tk ? 'Hoy · '+fmtShort.format(fromKey(k)) : cap(fmtShort.format(fromKey(k)));
      let body = '';
      if(open){
        const s = daySummary(k);
        body = `<div class="hist-body">
          ${s.lines.map(([ic,tx])=>`<div class="hline"><span>${ic}</span><p>${tx}</p></div>`).join('')}
          ${s.nMeals ? `<div class="nut">${nutritionHTML(s.a)}
            <div class="tiny">Valores aproximados por porción típica (USDA FoodData Central). Referencia: dieta de 2000 kcal.</div></div>` : ''}
          <div class="tomorrow"><div class="label">📌 Para el día siguiente</div>
            <ul>${nextDayRecs(k).map(r=>`<li>${r}</li>`).join('')}</ul></div>
        </div>`;
      }
      return `<div class="card hist ${open?'open':''}">
        <button class="hist-head" data-act="hist" data-k="${k}">
          <span>${label}</span>
          <span class="score-pill ${done===items.length?'full':''}">${done}/${items.length} ${open?'▴':'▾'}</span>
        </button>${body}</div>`;
    }).join('')}`;
}

/* ---------- Ajustes ---------- */
function settingsHTML(){
  return `
  <h1 class="cat-title">⚙︎ Ajustes</h1>
  <div class="card">
    <div class="head-row"><h3>Horarios fijos</h3></div>
    <div class="muted" style="margin-top:0">Son las actividades con horario que aparecen en "Deberías estar".</div>
    ${state.schedule.map(b=>`
      <div class="card" style="background:var(--bg2);margin-top:12px">
        <div class="row" style="margin-top:0">
          <label class="field" style="flex:0 0 64px">Ícono<input data-sid="${b.id}" data-f="emoji" value="${esc(b.emoji||'')}"></label>
          <label class="field">Deberías estar…<input data-sid="${b.id}" data-f="estar" value="${esc(b.estar)}"></label>
        </div>
        <div class="row"><label class="field">Faltan X para…<input data-sid="${b.id}" data-f="para" value="${esc(b.para)}"></label></div>
        <div class="row">
          <label class="field">Desde<input type="time" data-sid="${b.id}" data-f="start" value="${b.start}"></label>
          <label class="field">Hasta<input type="time" data-sid="${b.id}" data-f="end" value="${b.end}"></label>
        </div>
        <button class="btn small danger" data-act="sched-del" data-id="${b.id}">Eliminar</button>
      </div>`).join('')}
    <button class="btn" data-act="sched-add">+ Agregar horario</button>
  </div>
  <div class="card">
    <div class="head-row"><h3>Copia de seguridad</h3></div>
    <div class="muted" style="margin-top:0">Tus datos se guardan en este dispositivo. Exportalos de vez en cuando para no perderlos o pasarlos a otro celular.</div>
    <button class="btn" data-act="export">⬇ Exportar datos</button>
    <label class="btn">⬆ Importar datos<input type="file" accept="application/json" id="importFile" hidden></label>
    <button class="btn danger" data-act="reset">${resetArmed?'Tocá de nuevo para borrar TODO':'Borrar todos los datos'}</button>
  </div>`;
}

/* ============ Eventos ============ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act;
  if(act!=='reset') resetArmed=false;
  switch(act){
    case 'go':
      view = t.dataset.v; ideasOpen=null; menuOpen=false; histOpen=null;
      if(['mente','cuerpo','espiritu'].includes(view)) selDate = todayKey();
      render(); window.scrollTo(0,0); break;
    case 'date': {
      const d = fromKey(selDate); d.setDate(d.getDate()+Number(t.dataset.d));
      if(keyOf(d) <= todayKey()){ selDate = keyOf(d); ideasOpen=null; render(); }
      break; }
    case 'toggle': {
      const f=t.dataset.f, cur=getDay(selDate)[f];
      updateDay(selDate,{[f]:!cur});
      if(!cur && state.timers[f]) delete state.timers[f], save();
      render(); break; }
    case 'step': {
      const f=t.dataset.f, step=Number(t.dataset.d), d=getDay(selDate);
      let v = f==='sueno' ? (d.sueno==null ? GOALS.sueno : d.sueno+step) : d[f]+step;
      v = f==='sueno' ? Math.min(16,Math.max(0,v)) : Math.min(999,Math.max(0,v));
      updateDay(selDate,{[f]:v}); render(); break; }
    case 'timer': {
      const f=t.dataset.f;
      if(state.timers[f]) delete state.timers[f]; else state.timers[f] = Date.now()+GOALS.minutosMente*60*1000;
      save(); updateTimers(); break; }
    case 'ideas': ideasOpen = ideasOpen===t.dataset.m ? null : t.dataset.m; ideasPage=0; render(); break;
    case 'hist': histOpen = histOpen===t.dataset.k ? '' : t.dataset.k; render(); break;
    case 'more-ideas': ideasPage++; render(); break;
    case 'pick': {
      const d=getDay(selDate); d.comidas[t.dataset.m]=t.dataset.t; updateDay(selDate,{comidas:d.comidas});
      ideasOpen=null; render(); toast('¡Anotado!'); break; }
    case 'menu-toggle': menuOpen=!menuOpen; render(); break;
    case 'menu-regen': {
      const wk=weekKeys(selDate)[0]; state.menuSeed=state.menuSeed||{}; state.menuSeed[wk]=(state.menuSeed[wk]||0)+1;
      save(); render(); toast('Menú nuevo armado'); break; }
    case 'sched-add':
      state.schedule.push({id:'s'+Date.now(), emoji:'⏰', estar:'nueva actividad', para:'nueva actividad', start:'12:00', end:'13:00'});
      save(); render(); break;
    case 'sched-del':
      state.schedule = state.schedule.filter(b=>b.id!==t.dataset.id); save(); render(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download = `orden-backup-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Datos exportados'); break; }
    case 'reset':
      if(!resetArmed){ resetArmed=true; render(); }
      else { resetArmed=false; state={days:{},schedule:structuredClone(DEFAULT_SCHEDULE),timers:{}}; save(); toast('Datos borrados'); view='home'; render(); }
      break;
  }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.dataset.meal){
    const d=getDay(selDate); d.comidas[el.dataset.meal]=el.value; updateDay(selDate,{comidas:d.comidas});
    const prog=catProgress(todayKey()).cuerpo, n=prog.filter(Boolean).length;
    const tab=document.querySelector('#tabs [data-cat=cuerpo]'); tab.querySelector('small').textContent=`${n}/3`; tab.classList.toggle('done',n===3);
  }
});
/* Botones rápidos de comidas: aparecen al tocar el campo */
document.addEventListener('focusin', e=>{
  const m = e.target.dataset && e.target.dataset.meal; if(!m) return;
  document.querySelectorAll('[data-quick]').forEach(q=> q.hidden = q.dataset.quick!==m);
});
document.addEventListener('focusout', e=>{
  if(!(e.target.dataset && e.target.dataset.meal)) return;
  setTimeout(()=>{ const a=document.activeElement; if(!(a && a.dataset && a.dataset.meal)) document.querySelectorAll('[data-quick]').forEach(q=>q.hidden=true); }, 150);
});
document.addEventListener('pointerdown', e=>{ if(e.target.closest('.qchip')) e.preventDefault(); });
document.addEventListener('click', e=>{
  const c = e.target.closest('.qchip'); if(!c) return;
  const m = c.parentElement.dataset.quick, inp = document.getElementById('m-'+m);
  let parts = inp.value.split('+').map(x=>x.trim()).filter(Boolean);
  if(c.dataset.q==='__undo') parts.pop();
  else parts.push(parts.length ? c.dataset.q.toLowerCase() : c.dataset.q);
  inp.value = parts.join(' + ');
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  inp.focus();
});
document.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset.sid){
    const b = state.schedule.find(x=>x.id===el.dataset.sid);
    if(b){ b[el.dataset.f]=el.value; save(); toast('Guardado'); }
  }
  if(el.id==='importFile' && el.files[0]){
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const s = JSON.parse(r.result);
        if(!s || typeof s.days!=='object') throw 0;
        state = {days:s.days, schedule:Array.isArray(s.schedule)?s.schedule:structuredClone(DEFAULT_SCHEDULE), timers:{}, menuSeed:s.menuSeed||{}};
        save(); toast('Datos importados'); render();
      }catch(err){ toast('Ese archivo no es una copia válida'); }
    };
    r.readAsText(el.files[0]);
  }
});

/* ============ Reloj ============ */
setInterval(()=>{
  const tk = todayKey();
  if(tk!==lastToday){ if(selDate===lastToday) selDate=tk; lastToday=tk; render(); return; }
  if(Object.keys(state.timers).length) updateTimers();
  if(view==='home') updateHome(false);
}, 1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });

render();

/* ============ App instalable (offline) ============ */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
</script>
